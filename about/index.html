<time>2026-09-14</time></div><h1 class=post-title>关于</h1></header><div class=post-content><p>这个站点叫「历总似」——取自那句老话：历史不会重演，但总会有惊人的相似。</p><p>这里不预测下一秒会发生什么，而是记录那些反复出现的规律、信号与套路：技术里被反复验证过的工具与技巧，投资里量价与情绪反复上演的剧本，研究里试图用数学抓住的模式。</p><p>市场不会重演，但人性、周期与结构总会以相似的方式回来。历总似，是一个长期项目的名字，也是一种看待世界的方式。</p></div></article></main><footer class=site-footer><div class=container><p>© 2026 历总似. 使用 <a href=https://gohugo.io target=_blank rel=noopener>Hugo</a> 构建，托管于 <a href=https://pages.github.com target=_blank rel=noopener>GitHub Pages</a>。</p><p><a href=https://github.com/skysunsun target=_blank rel=noopener>GitHub 源码</a></p></div></footer></body></html>
