name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# peaceiris/actions-gh-pages 需要写权限来推送 gh-pages 分支
permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.165.0"
          extended: true

      # 用 config.toml 里的 baseURL（已设为 https://skysunsun.github.io/The-way-back/）
      - name: Build with Hugo
        run: hugo --minify

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          # 发布到 gh-pages 分支；仓库 Settings → Pages → Source 选 "Deploy from a branch" → gh-pages
