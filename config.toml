# ============================================================
#  Hugo 站点配置 —— 历总似（历史不会重演，但总会有惊人的相似）
# ============================================================

# 部署后把 baseURL 改成你的 GitHub Pages 项目页地址，例如：
#   baseURL = "https://your-username.github.io/blog/"
# 若后续绑定自定义域名，则改成 "https://your-domain.com/"
baseURL = "https://sky.dpdns.org/"
title = "历总似"
paginate = 8
enableEmoji = true

# ===== 自定义参数（在模板里通过 .Site.Params 读取）=====
[params]
  description = "历史不会重演，但总会有惊人的相似——记录那些反复出现的规律、信号与套路。"
  author = "历总似"
  github = "https://github.com/skysunsun"   # 改成你的 GitHub 主页

# ===== 渲染设置 =====
[markup]
  # 允许在 Markdown 中书写原始 HTML（插入图表、iframe、表格等）
  [markup.goldmark.renderer]
    unsafe = true
  # 代码高亮（Chroma 内置，无需外部依赖）
  [markup.highlight]
    style = "github"
    noClasses = false

# ===== 顶部导航菜单 =====
[menu]
  [[menu.main]]
    name = "韵"
    url = "/rhyme/"
    weight = 1
  [[menu.main]]
    name = "来时路"
    url = "/laishilu/"
    weight = 2
  [[menu.main]]
    name = "关于"
    url = "/about/"
    weight = 3
