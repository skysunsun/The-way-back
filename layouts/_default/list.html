{{ define "main" }}
<header class="list-header">
  <h1>{{ .Title }}</h1>
  {{ with .Content }}<div class="list-intro">{{ . }}</div>{{ end }}
</header>
<div class="post-list">
  {{ range .Paginator.Pages }}
    {{ partial "post-card.html" . }}
  {{ end }}
</div>
{{ template "_internal/pagination.html" . }}
{{ end }}
