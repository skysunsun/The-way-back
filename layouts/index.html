{{ define "main" }}
<section class="hero">
  <h1>{{ .Site.Title }}</h1>
  <p class="lead">{{ .Site.Params.description }}</p>
</section>

<h2 class="section-title">最新文章</h2>
<div class="post-list">
  {{ $pages := where .Site.RegularPages "Section" "in" (slice "research" "tech" "investment") }}
  {{ range first 12 (sort $pages "Date" "desc") }}
    {{ partial "post-card.html" . }}
  {{ end }}
</div>
{{ end }}
